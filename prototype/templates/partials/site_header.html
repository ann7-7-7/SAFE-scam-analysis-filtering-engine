<header class="safe-home__header" aria-label="Site header">
    <nav class="safe-home__nav" aria-label="Main navigation">
        <div class="safe-home__nav-left">
            <a class="safe-home__brand" href="{{ url_for('index') }}">S.A.F.E</a>
            <ul class="safe-home__links" aria-label="Primary links">
                <li><a class="safe-home__link{% if active_page == 'home' %} safe-home__link--active{% endif %}" href="{{ url_for('index') }}">Home</a></li>
                <li><a class="safe-home__link{% if active_page == 'checker' %} safe-home__link--active{% endif %}" href="{{ checker_nav_href | default(url_for('checker')) }}">S.A.F.E Checker</a></li>
                <li><a class="safe-home__link{% if active_page == 'dataset' %} safe-home__link--active{% endif %}" href="{{ url_for('dataset') }}">Scam Types</a></li>
                <li><a class="safe-home__link{% if active_page == 'about' %} safe-home__link--active{% endif %}" href="{{ url_for('about') }}">About</a></li>
                <li><a class="safe-home__link{% if active_page == 'contact' %} safe-home__link--active{% endif %}" href="{{ url_for('contact') }}">Contact us</a></li>
            </ul>
        </div>
        <div class="safe-home__nav-right" aria-label="Actions">
            <a class="safe-home__btn safe-home__btn--primary nav-cta" href="{{ check_href }}">Check a message</a>
        </div>
    </nav>
</header>
